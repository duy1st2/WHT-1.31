[Runtime]

Mode=local

Enabled=1



[License]

Server=http://127.0.0.1:5187

Key=



[Event]

; D3D8 ambient grayscale 1..255; 0 keeps/restores engine ownership (not gamma).

Light=0

; Remove visual scene fog only; does not reveal fog of war. #nfe toggles.

Remove Fog Effect=0

; Alert when enemy player clicks / selects units in Fog of War. #fc toggles.

Fog Click=0

; Notification when player is kicked or banned. #hn toggles.

Show Noti Kick/Ban=1

; Notification & file logging when a player saves the game. #csave toggles.

Noti/Log Info Players Save Game=0

; Original ETS sound, once on the next match-start event; disabled by default.

Sound Start Game=0

; Use Warcraft's existing FPS display (not the ETS custom overlay).

Show FPS=1

; Native Warcraft resource table. Requires WHTResource.mpq; Tab collapses/expands.

Show Resource=1

; Imported native overlays. Existing user INI files are not rewritten during merge.

Show Hotkey In Panel=1

ShowCooldown=1

Show Timer=1

ShowRegenHP=1

ShowRegenMana=1

; Quick Drop Item (Shift+RightClick on inventory item)

Quick Drop Item=1

; Auto Pick Items nearby (scan radius 350, issues smart order)

Auto Pick Item=0

; HUD Action Toolbar (Buttons beside inventory: Pick, Drop All, Sell All, All Skills)

Show Auto Pick=1

Show Drop All=1

Show Sell All=1

Show Ins All Skills=1

; Speeds up glue-menu animation; disabled by default in this rebuild.

Fast Menu=1

; Hide/Disable Option Menu (F10 in-game menu). #menu toggles.

Hide Option Menu=0

; ModeCast: 0 = Quick Cast, 1 = Smart Cast, 2 = Quick Cast Old. #mc toggles.

ModeCast=0

Camera=3500.000000

FogZ=20000

WideScreen=0

Local Game Delay Reducer=100

Lan Game Delay Reducer=100

Net Game Delay Reducer=250

Delay Start Game=6

Unlock Map Size=1

; Load loose files in game directory before MPQ archives (models, UI, textures).

Allow Local Files=0

; Fast Jass: optimizes and accelerates JASS execution in Warcraft III. #fastjass toggles.

Fast Jass=1

; Custom / Fake player name in-game and lobby. Commands: #name <new> / #n <new>

OLDNames=

NewNames=

OLDNames_Ex=

NewNames_Ex=

NameCreate=

; Load extra DLLs on startup (comma-separated list, e.g. custom.dll,hook.dll). Command: #loaddll <dll>

LoadDll=

; Load extra MPQ archives on startup (comma-separated list, e.g. CustomUI.mpq). Command: #loadmpq <mpq>

LoadMPQ=

; Custom terrain rawcode applied across entire map on match start (e.g. Ldrt, Yblm). Command: #codenen <rawcode>

code_nen=

Keyboard Scroll Speed=100

Mouse Scroll Speed=100

whp=0.000000

wmp=0.000000

hhp=0.000000

hmp=0.000000

Show Mem=1

Reveal Invisibles=1
Show Ping=1



[HPBar]

Color=0xFF32CD32

Color Enemy=0xFFff4242



[ManaBar]

Enable=0

Color=0xFF00fcf8

Color Enemy=0xFF47b9ff

EnableForHero=1

EnableForNonHero=1



[StateTag]

Enable=0

EnableForHero=1

EnableForNonHero=1

ShowMaxValues=1

ShowHpValue=1

ShowManaValue=1

FontSize=8

ShowLevelHero=1



[Graphics]

; Hide existing overhead HP/Mana frame while native Invulnerable flag is set.

; Does not create a mana bar or alter HP/MP/invulnerability.

BarInvul=0

; Force vertex alpha to 255 during native color updates; RGB unchanged. Opt-in.

VertexColor=0

; Display Overhead HP Bar in each unit's Player Color (Player 1..16).

Color Player=0

; Format existing HP/MP labels only; both options are opt-in.

Text Life/Mana Commas=1

Text Life/Mana No Hide=1

; Group existing damage/armor/hero-stat text, preserving bonus colors.

Text Stats Commas=1

; 0 keeps/restores the game's setting; optional numeric cap 60..1000, memory only.

Fps Limit=0

Unlock Limit FPS=0

; Fullscreen display refresh rate in Hz (e.g. 60, 75, 120, 144, 240); 0 = default.

Refresh Rate=0

; Vertical sync: 0 = disabled (immediate swap), 1 = enabled (sync to monitor refresh).

Vsync=0

timeOfDayUI=0

; Extend the scene viewport into the bottom black-bar area (not console hiding).

BlackBarUI=0

; Hide the bottom stone console frame (CSimpleConsole) to expand screen view.

ConsoleUI=0

; Move the existing skill/item tooltip near the mouse; restore its prior anchor on disable.

MouseTooltipUI=0



; Independent periodic clearing, seconds 1..17. Off by default.

[DelayClear]

Enable Delay Clear Text Screen=0

Delay Clear Text Screen=3

Enable Delay Clear Chat Screen=0

Delay Clear Chat Screen=3



[Window]

Borderless=0

Lock Cursor=0



